app = "my-sluurp-app"
primary_region = "ams"

[build]

[http_service]
  internal_port = 8090
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    path = "/api/health"
    interval = "15s"
    timeout = "5s"

[mounts]
  source = "data"
  destination = "/data"
